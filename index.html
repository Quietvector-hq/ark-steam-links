<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open in Steam</title>
  <meta name="robots" content="noindex">
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 680px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
      background: #171a21;
      color: #c7d5e0;
    }
    .card {
      background: #1b2838;
      padding: 28px;
      border-radius: 12px;
    }
    h1 { margin-top: 0; font-size: 24px; }
    a.button {
      display: inline-block;
      margin: 8px 8px 8px 0;
      padding: 12px 18px;
      border-radius: 6px;
      text-decoration: none;
      background: #2a475e;
      color: white;
      font-weight: 600;
    }
    a.button:hover { background: #66c0f4; color: #171a21; }
    .small { opacity: .8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Steamを開いています…</h1>
    <p>Steamクライアントが自動で開かない場合は、下のボタンを押してください。</p>
    <p>
      <a id="steamButton" class="button" href="#">Steamで開く</a>
      <a id="webButton" class="button" href="#" target="_blank" rel="noopener">ブラウザで開く</a>
    </p>
    <p class="small">Steamがインストールされている必要があります。</p>
  </div>

<script>
const games = {
  "4558480": {
    name: "ARK: Tides of Fortune",
    web: "https://store.steampowered.com/app/4558480/ARK_Tides_of_Fortune/?curator_clanid=44719856"
  },
  "4558490": {
    name: "ARK: Dragontopia",
    web: "https://store.steampowered.com/app/4558490/ARK_Dragontopia/?curator_clanid=44719856"
  },
  "3720100": {
    name: "ARK: Lost Colony Expansion Pass",
    web: "https://store.steampowered.com/app/3720100/ARK_Lost_Colony_Expansion_Pass/?curator_clanid=44719856"
  },
  "3282470": {
    name: "ARK: Fantastic Tames - Dreadmare",
    web: "https://store.steampowered.com/app/3282470/ARK_Fantastic_Tames__Dreadmare/?curator_clanid=44719856"
  },
  "2972680": {
    name: "ARK: Fantastic Tames - Pyromane",
    web: "https://store.steampowered.com/app/2972680/ARK_Fantastic_Tames__Pyromane/?curator_clanid=44719856"
  }
};

const params = new URLSearchParams(location.search);
const id = params.get("app");
const game = games[id];

if (!game) {
  document.getElementById("title").textContent = "対象のゲームが見つかりません";
  document.getElementById("steamButton").style.display = "none";
  document.getElementById("webButton").style.display = "none";
} else {
  const steamUrl = "steam://store/" + id;
  document.title = game.name + " - Open in Steam";
  document.getElementById("title").textContent = game.name;
  document.getElementById("steamButton").href = steamUrl;
  document.getElementById("webButton").href = game.web;

  // Try to launch Steam after the HTTPS page is opened.
  // Some browsers may require an additional confirmation/user gesture.
  setTimeout(() => {
    window.location.href = steamUrl;
  }, 250);
}
</script>
</body>
</html>
